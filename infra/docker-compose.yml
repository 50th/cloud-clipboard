# ============================================================
# 云剪贴板 · 本地基础设施
#
# 用法（在仓库根目录执行）：
#   docker compose -f infra/docker-compose.yml up -d           # 启动全部
#   docker compose -f infra/docker-compose.yml up -d postgres  # 只启动 PostgreSQL
#   docker compose -f infra/docker-compose.yml ps              # 查看状态
#   docker compose -f infra/docker-compose.yml logs -f postgres
#   docker compose -f infra/docker-compose.yml down            # 停止（保留数据）
#   docker compose -f infra/docker-compose.yml down -v         # 停止并删除数据卷
#
# 端口约定：
#   5433 -> 容器 PostgreSQL（宿主 5432 已被本机原生 PostgreSQL 18 占用）
#   6379 -> Redis（预留端口，当前未定义服务）
#
# ⚠️ 镜像必须钉版本，不要用 latest：版本漂移会让本地与生产行为不一致，
#    且跨大版本 pg_dump/pg_restore 不兼容。
# ============================================================

services:
  postgres:
    # 使用本地已有的 postgres:16；若本地没有可正常联网拉取。
    # 离线环境仍可加 --pull never 启动
    image: postgres:16
    container_name: cloud-clipboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipboard}
      POSTGRES_DB: ${POSTGRES_DB:-clipboard}
      # 中文内容排序/比较的一致性
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipboard} -d ${POSTGRES_DB:-clipboard}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
    name: cloud-clipboard-postgres-data
