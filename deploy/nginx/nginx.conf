# ============================================================
# 云剪贴板 · Nginx 主配置（生产）
#
# 默认 HTTP(8080) 跳转到 HTTPS(8443)，证书放在 deploy/certs/。
# 无域名阶段使用 IP SAN 自签证书；换正式域名与证书后，
# 把 80 的跳转与 WEB_HTTPS_PORT 改回标准 443 即可。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ⚠️ 访问日志只记 $uri，不记 $request_uri：
    #    WebSocket 令牌在 query string（?token=<JWT>），不能落盘
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # 阶段一只同步文字，2 MB 足够
    client_max_body_size 2m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 登录限流：每 IP 10 次/分钟，允许突发 5 次
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    # 注册限流：每 IP 5 次/分钟，允许突发 3 次
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;
    # 触发限流时返回 429（默认是 503）
    limit_req_status 429;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # --- HTTP：只负责跳转到 HTTPS ---
    # ⚠️ 当前使用非标准端口 8443；若改回标准 443，
    #    把下面的 :8443 去掉（`return 301 https://$host$request_uri;`）
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # --- HTTPS ---
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        root  /usr/share/nginx/html;
        index index.html;

        # 自签证书阶段不要开 HSTS：浏览器会长期强制 HTTPS，换证书后难回退。
        # 正式证书启用后再打开：
        # add_header Strict-Transport-Security "max-age=31536000" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        include /etc/nginx/locations.conf;
    }
}
