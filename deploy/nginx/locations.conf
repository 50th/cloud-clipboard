# ============================================================
# 云剪贴板 · Nginx 站点路由（被 nginx.conf 的 server 块 include）
# 80 与 443 共用，避免两份配置漂移。
# ============================================================

# --- SPA 静态资源 ---
# index.html 不缓存，保证发版后立即生效
location = /index.html {
    expires -1;
}

# Vite 产物带内容哈希，可长缓存
location /assets/ {
    expires 30d;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

# --- 内部辅助接口 ---
# 应用层 ENABLE_DEV_ROUTES=false 已关闭，这里再兜底一次
location ^~ /api/v1/dev {
    return 404;
}

# --- WebSocket ---
# 精确匹配会优先于下面的 /api/ 前缀；令牌在 query string，关闭访问日志
location = /api/v1/clipboard/ws {
    access_log off;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# --- 登录限流 ---
location = /api/v1/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- 健康检查 ---
# 容器内部探针直接访问 api；这里让外部也能探活
location = /health {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- 其余 API ---
location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
